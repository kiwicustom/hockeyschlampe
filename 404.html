<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Not found — Hockey Schlampe</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/brand/hs-64.png" />
  <link rel="stylesheet" href="/css/site.css" />
  <script>
    (function () {
      var appOrigin = "https://app.hockeyschlampe.ch";
      var prefixes = [
        "/feed", "/about", "/feedback", "/admin", "/agb", "/privacy", "/datenschutz", "/impressum",
        "/2ndchance", "/2nd-chance", "/last-minute",
        "/bern", "/zuerich", "/zug", "/geneve", "/lausanne", "/lugano", "/davos", "/fribourg",
        "/biel", "/rapperswil", "/ambri", "/langnau", "/kloten", "/porrentruy", "/olten", "/basel",
        "/visp", "/winterthur", "/lachauxdefonds", "/weinfelden", "/glarus", "/chur"
      ];
      var path = location.pathname || "/";
      var bare = path.length > 1 && path.charAt(path.length - 1) === "/" ? path.slice(0, -1) : path;
      var hit = prefixes.some(function (prefix) {
        return bare === prefix || bare.indexOf(prefix + "/") === 0;
      });
      if (!hit) return;
      location.replace(appOrigin + path + location.search + location.hash);
    })();
  </script>
</head>
<body>
  <main class="section">
    <p class="section__kicker">404</p>
    <h1 class="section__title">Page not found</h1>
    <p class="section__lead">That URL isn’t on the Hockey Schlampe entry site.</p>
    <p style="margin-top:1.25rem">
      <a class="btn btn--primary" href="/">Back home</a>
      <a class="btn btn--outline" href="https://app.hockeyschlampe.ch/">Open app</a>
    </p>
  </main>
</body>
</html>
